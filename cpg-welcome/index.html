<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A quick welcome and a few simple steps before your Care Payments Group training call.">
  <title>Welcome to training | Care Payments Group</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#12324e;font:17px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1040px;margin:0 auto;padding:34px 22px 42px}header{margin-bottom:24px}header img{width:220px;max-width:65%;height:auto}h1{font-size:clamp(27px,4vw,38px);letter-spacing:-.03em;line-height:1.15;margin:22px 0 10px}p{margin:0 0 22px;color:#465b6e}.player{overflow:hidden;border-radius:16px;background:#12324e;box-shadow:0 12px 36px #12324e15}video{display:block;width:100%;height:auto;aspect-ratio:1904/1072}footer{padding-top:20px;font-size:15px}a{color:#385dad;text-underline-offset:3px}a:focus-visible{outline:3px solid #cf2b72;outline-offset:4px}@media(max-width:520px){main{padding:24px 14px}.player{border-radius:10px}}
  </style>
  <style>
    .player{position:relative}.play-fallback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:18px 28px;background:#385dad;color:white;font:700 clamp(16px,3vw,22px)/1.3 system-ui,sans-serif;box-shadow:0 5px 24px #12324e55;cursor:pointer;white-space:nowrap}.play-fallback:focus-visible{outline:4px solid #cf2b72;outline-offset:4px}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="logo.png" alt="Care Payments Group" width="660" height="207">
      <h1>We look forward to your training.</h1>
      <p>A quick welcome before we get set up together.</p>
    </header>
    <div class="player">
      <video id="welcome-video" controls playsinline autoplay preload="auto" poster="thumbnail.png" aria-label="Care Payments Group welcome and training preparation video">
        <source src="welcome.mp4" type="video/mp4">
        <track kind="captions" src="captions.vtt" srclang="en" label="English">
        <p><a href="welcome.mp4">Watch the welcome video</a></p>
      </video>
      <button class="play-fallback" id="play-fallback" type="button" hidden aria-controls="welcome-video">▶ Play with sound</button>
    </div>
    <footer><a href="welcome.mp4" download>Download the video</a> · About 32 seconds</footer>
  </main>
  <script>
    (() => {
      const video = document.getElementById('welcome-video');
      const fallback = document.getElementById('play-fallback');
      // The video already includes readable captions. Keep the optional native
      // track off initially, even when the browser remembers captions as enabled.
      // Run only during initialization so viewers can still enable it afterward.
      function initializeCaptions() {
        for (const track of video.textTracks) track.mode = 'disabled';
      }
      initializeCaptions();
      if (video.readyState < 1) {
        video.addEventListener('loadedmetadata', initializeCaptions, { once: true });
      }
      function showFallback() {
        if (video.paused) fallback.hidden = false;
      }
      function playWithSound() {
        video.muted = false;
        try {
          const playing = video.play();
          if (playing && typeof playing.catch === 'function') playing.catch(showFallback);
        } catch (_) {
          showFallback();
        }
      }
      video.addEventListener('playing', () => { fallback.hidden = true; });
      fallback.addEventListener('click', playWithSound);
      playWithSound();
    })();
  </script>
</body>
</html>
